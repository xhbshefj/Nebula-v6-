  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Star {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 1.6 + 0.4;
        this.baseOpacity = Math.random() * 0.5 + 0.5;
        this.opacity = this.baseOpacity;
        this.twinkleSpeed = Math.random() * 0.015 + 0.01;
        this.twinklePhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.twinklePhase += this.twinkleSpeed;
        this.opacity = this.baseOpacity + Math.sin(this.twinklePhase) * 0.2;
      }

      draw() {
        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class ShootingStar {
      constructor() {
        this.x = Math.random() * canvas.width * 0.5;
        this.y = Math.random() * canvas.height * 0.35;
        this.speed = Math.random() * 2.8 + 4.4;
        this.angle = Math.random() * 0.42 + 0.7;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.length = 120 + Math.random() * 80;
        this.age = 0;
        this.maxAge = 90;
        this.opacity = 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.age += 1;
        this.opacity = Math.max(0, 1 - this.age / this.maxAge);
      }

      draw() {
        if (this.opacity <= 0) return;

        const trailX = this.x - this.vx * (this.length / this.speed);
        const trailY = this.y - this.vy * (this.length / this.speed);

        const grad = ctx.createLinearGradient(trailX, trailY, this.x, this.y);
        grad.addColorStop(0, 'rgba(255, 210, 120, 0)');
        grad.addColorStop(0.3, `rgba(255, 215, 135, ${this.opacity * 0.9})`);
        grad.addColorStop(1, `rgba(255, 255, 255, ${this.opacity})`);

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(trailX, trailY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
      }

      alive() {
        return this.age < this.maxAge && this.x < canvas.width + 200 && this.y < canvas.height + 200;
      }
    }

    function initStars() {
      stars = [];
      const count = Math.min(220, Math.max(140, Math.floor((canvas.width * canvas.height) / 12)));
      for (let i = 0; i < count; i++) {
        stars.push(new Star());
      }
    }

    function spawnShootingStar() {
      shootingStars.push(new ShootingStar());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        star.update();
        star.draw();
      }

      shootingStars = shootingStars.filter(star => star.alive());
      for (const star of shootingStars) {
        star.update();
        star.draw();
      }

      requestAnimationFrame(animate);
    }

    resizeCanvas();
    initStars();
    animate();
    setInterval(spawnShootingStar, 3500);

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });
  </script>

  <script>
    function filterGames() {
      const input = document.getElementById('gameSearch').value.toLowerCase();
      const links = document.querySelectorAll('.grid a');
      const noResults = document.getElementById('noResults');
      let foundAny = false;

      links.forEach(link => {
        const title = link.querySelector('img').alt.toLowerCase();
        if (title.includes(input)) {
          link.style.display = "block";
          foundAny = true;
        } else {
          link.style.display = "none";
        }
      });
      noResults.style.display = foundAny ? "none" : "block";
    }

    document.querySelectorAll('.grid a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
      });
    });
  </script>
